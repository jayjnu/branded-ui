name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      filter:
        description: Optional pnpm package filter; empty publishes all packages
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish packages
        env:
          PUBLISH_FILTER: ${{ inputs.filter }}
        run: |
          if [ -n "$PUBLISH_FILTER" ]; then
            pnpm --filter "$PUBLISH_FILTER" publish --access public --no-git-checks --provenance
          else
            pnpm -r publish --access public --no-git-checks --provenance
          fi
